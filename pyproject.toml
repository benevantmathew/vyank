[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vyank"
version = "0.2.0"
description = "Tkinter YouTube downloader for videos, audio, playlists, and channels."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Benevant Mathew", email = "benevantmathewv@gmail.com" }
]

keywords = [
    "youtube",
    "downloader",
    "video-downloader",
    "audio-downloader",
    "tkinter",
    "ffmpeg",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]

dependencies = [
    "pytubefix>=10.10.1",
    "yt-dlp>=2025.8.11",
]

[project.urls]
Homepage = "https://github.com/benevantmathew/vyank"
Repository = "https://github.com/benevantmathew/vyank"
Issues = "https://github.com/benevantmathew/vyank/issues"
Changelog = "https://github.com/benevantmathew/vyank/blob/master/CHANGELOG.md"

[project.scripts]
vyank = "vyank.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["vyank", "vyank.*"]
namespaces = true

[dependency-groups]
dev = [
    "build>=1.5.0",
    "setuptools>=82.0.1",
    "twine>=6.2.0",
]
